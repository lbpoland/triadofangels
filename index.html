<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta http-equiv="x-ua-compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Triad of Angels | ToA Studios — Official Site</title>
  <meta name="description" content="Official site for Triad of Angels and ToA Studios. Explore albums, tracks, lyrics, and publishing. Stream on Spotify, Apple Music, and YouTube.">
  <link rel="preload" href="./css/style.css" as="style"><link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div id="site-header" role="region" aria-label="Site Header"></div>

      <div id="home-featured" class="grid" style="margin-top:12px"></div>
    </section>
    <section class="section" aria-labelledby="featured-videos-h">
      <h2 id="featured-videos-h">Featured Videos</h2>
      <div id="featured-videos"></div>
    </section>
  </main>
  <div id="site-footer" role="region" aria-label="Site Footer"></div>

<script src="/js/data.js"></script>
<script src="/js/data-bridge.js"></script>
<script type="module" src="/js/site.js"></script>
