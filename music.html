<!DOCTYPE html>
<html lang="en">
<head>
  <!-- ============================================================
       Triad of Angels | ToA Studios — Music Library
       Filterable albums grid, data-driven from catalog.js
       ============================================================ -->
  <meta charset="utf-8">
  <meta http-equiv="x-ua-compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Music Library — Triad of Angels | ToA Studios</title>
  <meta name="description" content="Browse the full Triad of Angels and ToA Studios catalog. Filter albums by artist and genre.">

  <link rel="canonical" href="https://www.triadofangels.com/music.html">
  <meta name="theme-color" content="#0b0c10">

  <!-- Styles -->
  <link rel="preload" href="/css/style.css" as="style">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="site-header" role="region" aria-label="Site Header"></div>

  <main id="main" class="container" role="main">
    <section class="section" aria-labelledby="music-h">
      <h1 id="music-h">Music</h1>
      <p>Explore albums across artists and genres.</p>
      <div class="flex" style="margin-top:10px">
        <label>
          <span class="sr-only">Filter by artist</span>
          <select id="filter-artist" aria-label="Filter by artist"></select>
        </label>
        <label>
          <span class="sr-only">Filter by genre</span>
          <select id="filter-genre" aria-label="Filter by genre"></select>
        </label>
      </div>
    </section>

    <section class="section" aria-labelledby="albums-h">
      <h2 id="albums-h">Albums</h2>
      <div id="music-grid" style="margin-top:12px"></div>
    </section>
  </main>

  <div id="site-footer" role="region" aria-label="Site Footer"></div>

<script src="/js/data.js"></script>
<script src="/js/data-bridge.js"></script>
<script type="module" src="/js/site.js"></script>
<script src="./js/render.js"></script>
<script src="./js/components/header.js"></script>
<script src="./js/components/footer.js"></script>

</body>
</html>
